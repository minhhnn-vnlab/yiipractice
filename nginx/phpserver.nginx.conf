    server {
        set_real_ip_from 0.0.0.0/0; # Allow all IPs (adjust according to your security needs)
        real_ip_header X-Forwarded-For;
        charset utf-8;
        client_max_body_size 128M;
        sendfile off;
        listen 8080; ## listen for ipv4
        #listen [::]:80 default_server ipv6only=on; ## listen for ipv6

        server_name y2aa-frontend.test;
        root        /yii-application/frontend/web/;
        index       index.php;

        access_log  /yii-application/log/frontend-access.log;
        error_log   /yii-application/log/frontend-error.log;

        location / {
            # Redirect everything that isn't a real file to index.php
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # uncomment to avoid processing of calls to non-existing static files by Yii
        #location ~ \.(js|css|png|jpg|gif|swf|ico|pdf|mov|fla|zip|rar)$ {
        #    try_files $uri =404;
        #}
        #error_page 404 /404.html;

        # deny accessing php files for the /assets directory
        location ~ ^/assets/.*\.php$ {
            deny all;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass php:9000;
            #fastcgi_pass unix:/var/run/php5-fpm.sock;
            try_files $uri =404;
        }
        location /api/ {  # Adjust this path as needed
            proxy_pass http://127.0.0.1:8080;  # Proxy to the backend server
            proxy_set_header Host y2aa-backend.test;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location ~* /\. {
            deny all;
        }
    }
        
    server {
        charset utf-8;
        client_max_body_size 128M;
        sendfile off;
        listen 8080; ## listen for ipv4
        #listen [::]:80 default_server ipv6only=on; ## listen for ipv6
       
