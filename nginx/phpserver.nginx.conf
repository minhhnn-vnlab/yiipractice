        index       index.php;
       
        access_log  /yii-application/log/backend-access.log;
        error_log   /yii-application/log/backend-error.log;
       
        location / {
            allow 172.20.0.0/16;
            allow 192.168.33.1;
            allow 127.0.0.1;
